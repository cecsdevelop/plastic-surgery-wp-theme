<section class="about section" id="{id|about}">
  <div class="about__inner wrap">
    <div class="about__body">
      <span class="eyebrow">{eyebrow|{t:about.eyebrow}}</span>
      <h2 class="about__title">{title:html}</h2>
      <p class="about__text">{text}</p>
      <ul class="about__list">
        <li class="about__item"><img class="about__icon" src="{icon1:icon|mobile-app}" alt="" width="56" height="56"><div><h3 class="about__item-title">{item1_title}</h3><p>{item1_text}</p></div></li>
        <li class="about__item"><img class="about__icon" src="{icon2:icon|social}" alt="" width="56" height="56"><div><h3 class="about__item-title">{item2_title}</h3><p>{item2_text}</p></div></li>
        <li class="about__item"><img class="about__icon" src="{icon3:icon|write}" alt="" width="56" height="56"><div><h3 class="about__item-title">{item3_title}</h3><p>{item3_text}</p></div></li>
      </ul>
      <a class="btn btn--primary btn--arrow" href="{cta_url:url|}">{cta_text}</a>
      {content}
    </div>
    <div class="about__media">
      <span class="about__photo about__photo--1"><img src="{image1:url|}" alt="" loading="lazy" decoding="async"></span>
      <span class="about__photo about__photo--2"><img src="{image2:url|}" alt="" loading="lazy" decoding="async"></span>
      <span class="about__photo about__photo--3"><img src="{image3:url|}" alt="" loading="lazy" decoding="async"></span>
    </div>
  </div>
</section>
