<section class="process section" id="{id|framework}">
  <div class="process__inner wrap">
    <span class="process__photo"><img src="{image:url|}" alt="" loading="lazy" decoding="async"></span>
    <div class="process__body">
      <span class="eyebrow">{eyebrow|{t:process.eyebrow}}</span>
      <h2 class="process__title accent">{title:html}</h2>
      <p class="process__text">{text}</p>
      <ol class="process__steps">
        <li class="process__step"><h3 class="process__step-title">{step1_title}</h3><p>{step1_text}</p></li>
        <li class="process__step"><h3 class="process__step-title">{step2_title}</h3><p>{step2_text}</p></li>
        <li class="process__step"><h3 class="process__step-title">{step3_title}</h3><p>{step3_text}</p></li>
        <li class="process__step"><h3 class="process__step-title">{step4_title}</h3><p>{step4_text}</p></li>
      </ol>
      <a class="btn btn--primary btn--arrow" href="{cta_url:url|#contacto}">{cta_text}</a>
      {content}
    </div>
  </div>
</section>
