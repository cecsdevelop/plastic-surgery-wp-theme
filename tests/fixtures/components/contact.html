<section class="contact section" id="{id|contacto}" data-watermark="{watermark|{site_name}}">
  <div class="contact__inner wrap">
    <div class="contact__body">
      <span class="eyebrow">{eyebrow|{t:contact.eyebrow}}</span>
      <h2 class="contact__title">{title:html}</h2>
      <p class="contact__text">{text}</p>
    </div>
    <div class="contact__form">{content}</div>
  </div>
</section>
