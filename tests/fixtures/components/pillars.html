<section class="pillars section" id="{id|philosophy}">
  <div class="pillars__inner wrap">
    <h2 class="pillars__title accent">{title:html}</h2>
    <ul class="pillars__grid">
      <li class="pillars__item"><img class="pillars__icon" src="{icon1:icon|mobile-app}" alt="" width="56" height="56"><div><h3 class="pillars__name">{item1_title}</h3><p>{item1_text}</p></div></li>
      <li class="pillars__item"><img class="pillars__icon" src="{icon2:icon|update}" alt="" width="56" height="56"><div><h3 class="pillars__name">{item2_title}</h3><p>{item2_text}</p></div></li>
      <li class="pillars__item"><img class="pillars__icon" src="{icon3:icon|social}" alt="" width="56" height="56"><div><h3 class="pillars__name">{item3_title}</h3><p>{item3_text}</p></div></li>
      <li class="pillars__item"><img class="pillars__icon" src="{icon4:icon|search}" alt="" width="56" height="56"><div><h3 class="pillars__name">{item4_title}</h3><p>{item4_text}</p></div></li>
      <li class="pillars__item"><img class="pillars__icon" src="{icon5:icon|write}" alt="" width="56" height="56"><div><h3 class="pillars__name">{item5_title}</h3><p>{item5_text}</p></div></li>
      <li class="pillars__item"><img class="pillars__icon" src="{icon6:icon|code}" alt="" width="56" height="56"><div><h3 class="pillars__name">{item6_title}</h3><p>{item6_text}</p></div></li>
    </ul>
    {content}
  </div>
</section>
