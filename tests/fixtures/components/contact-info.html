<section class="contact-info section" id="{id|contact-info}">
  <div class="contact-info__inner wrap">
    <ul class="contact-info__list">
      <li class="contact-info__item"><a class="contact-info__link" href="{item1_url:url|}"><img class="contact-info__icon" src="{item1_icon:icon|phone}" alt="" width="64" height="64" loading="lazy"><span class="contact-info__title">{item1_title|WhatsApp}</span><span class="contact-info__text">{item1_text}</span></a></li>
      <li class="contact-info__item"><a class="contact-info__link" href="{item2_url:url|}"><img class="contact-info__icon" src="{item2_icon:icon|mail}" alt="" width="64" height="64" loading="lazy"><span class="contact-info__title">{item2_title|E-Mail}</span><span class="contact-info__text">{item2_text}</span></a></li>
      <li class="contact-info__item"><a class="contact-info__link" href="{item3_url:url|}"><img class="contact-info__icon" src="{item3_icon:icon|map-pin}" alt="" width="64" height="64" loading="lazy"><span class="contact-info__title">{item3_title|{t:contact_info.address}}</span><span class="contact-info__text">{item3_text}</span></a></li>
    </ul>
    {content}
  </div>
</section>
