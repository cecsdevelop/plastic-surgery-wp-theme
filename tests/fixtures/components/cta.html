<section class="cta section section--surface">
  <div class="cta__inner wrap">
    <div class="cta__content">
      <h2 class="cta__title">{title:html}</h2>
      <p class="cta__text">{text}</p>
      <a class="btn btn--primary btn--arrow" href="{cta_url:url|#contacto}">{cta_text|{t:cta.icon_label}}</a>
      {content}
    </div>
    <div class="cta__media"><img src="{image:url|}" alt="" loading="lazy" decoding="async"></div>
  </div>
</section>
